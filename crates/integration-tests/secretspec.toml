[project]
name = "storage-engine-integration-tests"
revision = "1.0"

[profiles.default]
SE_CI_CATALOG_CONFIG = { description = "catalog configuration as JSON, including authentication properties", required = true }
SE_CI_OBJECT_STORE_CONFIG = { description = "object store configuration as JSON with scheme and options", required = true }

# Named profiles. Format: <object-store>-x-<catalog>
#
# Example: `s3-x-r2-basin` means the test uses AWS S3 for the engine object
# store, and Cloudflare Basin Catalog for the Iceberg catalog.

[profiles.cloudflare-r2-x-cloudflare-r2-basin-catalog]
SE_CI_OBJECT_STORE_CONFIG = { ref = { item = "ci-cloudflare-r2" } }
SE_CI_CATALOG_CONFIG = { ref = { item = "ci-cloudflare-r2-basin-catalog" } }


[profiles.azure-blob-storage-x-cloudflare-r2-basin-catalog]
SE_CI_OBJECT_STORE_CONFIG = { ref = { item = "ci-azure-blob-storage" } }
SE_CI_CATALOG_CONFIG = { ref = { item = "ci-cloudflare-r2-basin-catalog" } }
