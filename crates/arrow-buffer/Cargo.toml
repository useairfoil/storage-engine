[package]
name = "opendata-arrow-buffer"
version.workspace = true
edition.workspace = true
description = "Stateless object storage buffer library for OpenData systems"
license = "MIT"
repository = "https://github.com/opendata-oss/opendata"
readme = "README.md"
keywords = ["database", "buffer", "batching", "streaming"]
categories = ["database"]

[lib]
name = "buffer"
path = "src/lib.rs"

[dependencies]
opendata-common = { git = "https://github.com/opendata-oss/opendata.git", revision = "5f5c288" }
arrow-array.workspace = true
arrow-ipc = { workspace = true, features = ["zstd"] }
arrow-schema.workspace = true
bytes.workspace = true
futures.workspace = true
metrics = "0.24"
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
slatedb.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
ulid.workspace = true

[dev-dependencies]
datafusion = { version = "53.1.0", default-features = false }
insta.workspace = true
tokio = { workspace = true, features = ["test-util"] }
