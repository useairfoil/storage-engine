name: Release Storage Engine

on:
  workflow_call:
    inputs:
      major:
        required: true
        type: string
      minor:
        required: true
        type: string
      patch:
        required: true
        type: string
      prerel:
        required: false
        type: string
    secrets:
      cachix-token:
        required: true
      quay-username:
        required: true
      quay-password:
        required: true

jobs:
  build-linux-x86_64:
    name: "Binary x86_64: Build"
    uses: ./.github/workflows/build.yml
    with:
      os: namespace-profile-large
      target: default
      artifact_name: "se-x86_64-linux"
    secrets:
      cachix-token: "${{ secrets.cachix-token }}"

  build-linux-aarch64:
    name: "Binary aarch64: Build"
    uses: ./.github/workflows/build.yml
    with:
      os: namespace-profile-large-arm64
      target: default
      artifact_name: "se-aarch64-linux"
    secrets:
      cachix-token: "${{ secrets.cachix-token }}"

  build-image-linux-x86_64:
    name: "Docker x86_64: Build"
    uses: ./.github/workflows/build.yml
    needs: [build-linux-x86_64]
    with:
      os: namespace-profile-small
      target: image
      artifact_name: "docker-x86_64-linux.tar.gz"
    secrets:
      cachix-token: "${{ secrets.cachix-token }}"

  build-image-linux-aarch64:
    name: "Docker aarch64: Build"
    uses: ./.github/workflows/build.yml
    needs: [build-linux-aarch64]
    with:
      os: namespace-profile-small-arm64
      target: image
      artifact_name: "docker-aarch64-linux.tar.gz"
    secrets:
      cachix-token: "${{ secrets.cachix-token }}"

  build-stress-image-linux-x86_64:
    name: "Stress Docker x86_64: Build"
    uses: ./.github/workflows/build.yml
    needs: [build-linux-x86_64]
    with:
      os: namespace-profile-small
      target: stress-image
      artifact_name: "docker-stress-x86_64-linux.tar.gz"
    secrets:
      cachix-token: "${{ secrets.cachix-token }}"

  build-stress-image-linux-aarch64:
    name: "Stress Docker aarch64: Build"
    uses: ./.github/workflows/build.yml
    needs: [build-linux-aarch64]
    with:
      os: namespace-profile-small-arm64
      target: stress-image
      artifact_name: "docker-stress-aarch64-linux.tar.gz"
    secrets:
      cachix-token: "${{ secrets.cachix-token }}"

  publish-binaries:
    name: "Binaries: Publish"
    needs:
      - build-linux-x86_64
      - build-linux-aarch64
    runs-on: namespace-profile-small
    steps:
      - name: Download binary for Linux x86_64
        uses: actions/download-artifact@v8.0.1
        with:
          name: se-x86_64-linux
          path: /tmp/bin/x86_64-linux
      - name: Download binary for Linux aarch64
        uses: actions/download-artifact@v8.0.1
        with:
          name: se-aarch64-linux
          path: /tmp/bin/aarch64-linux
      - name: Rename binaries
        run: |
          mkdir /tmp/artifacts

          cp /tmp/bin/x86_64-linux/se /tmp/artifacts/se-x86_64-linux
          cp /tmp/bin/x86_64-linux/se-hash.txt /tmp/artifacts/se-x86_64-linux-hash.txt

          cp /tmp/bin/aarch64-linux/se /tmp/artifacts/se-aarch64-linux
          cp /tmp/bin/aarch64-linux/se-hash.txt /tmp/artifacts/se-aarch64-linux-hash.txt
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@2.11.5
        with:
          file: /tmp/artifacts/*
          file_glob: true

  publish-docker-image:
    name: "Docker Image: Publish"
    permissions:
      contents: read
    needs:
      [build-image-linux-x86_64, build-image-linux-aarch64, publish-binaries]
    runs-on: namespace-profile-small
    steps:
      - name: Configure rootless container storage
        run: |
          # Avoid runner-provided storage and auth paths that require root permissions.
          cat > "$RUNNER_TEMP/storage.conf" <<EOF
          [storage]
          driver = "vfs"
          runroot = "$RUNNER_TEMP/containers/run"
          graphroot = "$RUNNER_TEMP/containers/storage"
          EOF
          echo "CONTAINERS_STORAGE_CONF=$RUNNER_TEMP/storage.conf" >> "$GITHUB_ENV"
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/registry-auth.json" >> "$GITHUB_ENV"
      - name: Set $USER if needed
        run: |
          if [ -z "$USER" ]; then
            echo "USER=runner" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v7.0.1
      - name: Set up nix cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: nix
      - uses: cachix/install-nix-action@v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-25.11
      - name: "Download: x86_64 image"
        uses: actions/download-artifact@v8.0.1
        with:
          name: docker-x86_64-linux.tar.gz
          path: /tmp/x86_64
      - name: "Download: aarch64 image"
        uses: actions/download-artifact@v8.0.1
        with:
          name: docker-aarch64-linux.tar.gz
          path: /tmp/aarch64
      - run: ls /tmp/x86_64 /tmp/aarch64
      - name: Publish docker image
        run: |
          nix develop .#ci --accept-flake-config -c publish-docker-image --impure
        env:
          IMAGE_NAME: storage-engine
          QUAY_USERNAME: ${{ secrets.quay-username }}
          QUAY_PASSWORD: ${{ secrets.quay-password }}
          IMAGE_VERSION_MAJOR: ${{ inputs.major }}
          IMAGE_VERSION_MINOR: ${{ inputs.minor }}
          IMAGE_VERSION_PATCH: ${{ inputs.patch }}
          IMAGE_VERSION_PREREL: ${{ inputs.prerel }}
          IMAGE_ARCHIVE_x86_64: /tmp/x86_64/storage-engine.tar.gz
          IMAGE_ARCHIVE_aarch64: /tmp/aarch64/storage-engine.tar.gz

  publish-stress-docker-image:
    name: "Stress Docker Image: Publish"
    permissions:
      contents: read
    needs:
      [build-stress-image-linux-x86_64, build-stress-image-linux-aarch64, publish-binaries]
    runs-on: namespace-profile-small
    steps:
      - name: Configure rootless container storage
        run: |
          # Avoid runner-provided storage and auth paths that require root permissions.
          cat > "$RUNNER_TEMP/storage.conf" <<EOF
          [storage]
          driver = "vfs"
          runroot = "$RUNNER_TEMP/containers/run"
          graphroot = "$RUNNER_TEMP/containers/storage"
          EOF
          echo "CONTAINERS_STORAGE_CONF=$RUNNER_TEMP/storage.conf" >> "$GITHUB_ENV"
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/registry-auth.json" >> "$GITHUB_ENV"
      - name: Set $USER if needed
        run: |
          if [ -z "$USER" ]; then
            echo "USER=runner" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v7.0.1
      - name: Set up nix cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: nix
      - uses: cachix/install-nix-action@v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-25.11
      - name: "Download: x86_64 stress image"
        uses: actions/download-artifact@v8.0.1
        with:
          name: docker-stress-x86_64-linux.tar.gz
          path: /tmp/stress/x86_64
      - name: "Download: aarch64 stress image"
        uses: actions/download-artifact@v8.0.1
        with:
          name: docker-stress-aarch64-linux.tar.gz
          path: /tmp/stress/aarch64
      - run: ls /tmp/stress/x86_64 /tmp/stress/aarch64
      - name: Publish stress docker image
        run: |
          nix develop .#ci --accept-flake-config -c publish-docker-image --impure
        env:
          IMAGE_NAME: se-stress
          QUAY_USERNAME: ${{ secrets.quay-username }}
          QUAY_PASSWORD: ${{ secrets.quay-password }}
          IMAGE_VERSION_MAJOR: ${{ inputs.major }}
          IMAGE_VERSION_MINOR: ${{ inputs.minor }}
          IMAGE_VERSION_PATCH: ${{ inputs.patch }}
          IMAGE_VERSION_PREREL: ${{ inputs.prerel }}
          IMAGE_ARCHIVE_x86_64: /tmp/stress/x86_64/se-stress.tar.gz
          IMAGE_ARCHIVE_aarch64: /tmp/stress/aarch64/se-stress.tar.gz
