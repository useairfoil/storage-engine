name: Build all crates

on:
  workflow_call:
    secrets:
      cachix-token:
        required: true
    inputs:
      os:
        required: true
        type: string
      target:
        required: false
        type: string
        default: "default"
      artifact_name:
        required: false
        type: string
        default: ""
      version:
        required: false
        type: string
        default: ""

jobs:
  build:
    name: "Build ${{ inputs.target }}"
    runs-on: "${{ inputs.os }}"
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          cachix-token: "${{ secrets.cachix-token }}"
      - name: Build target
        env:
          SE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$SE_VERSION" ]; then
            nix build .#${{ inputs.target }} -L --accept-flake-config --impure
          else
            nix build .#${{ inputs.target }} -L --accept-flake-config
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ inputs.artifact_name != '' }}
        with:
          name: ${{ inputs.artifact_name }}
          path: result/*
