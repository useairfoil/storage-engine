name: CI Pipeline

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  merge_group:

  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "main"
    types:
      - opened
      - synchronize

jobs:
  build-linux-x86_64:
    name: "Build"
    uses: ./.github/workflows/build.yml
    with:
      os: warp-ubuntu-latest-x64-8x
    secrets:
      cachix-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

  build-linux-x86_64-test-archive:
    name: "build test archive"
    uses: ./.github/workflows/build.yml
    needs: [build-linux-x86_64]
    with:
      os: warp-ubuntu-latest-x64-8x
      target: test-archive
      artifact_name: "se-test-archive"
    secrets:
      cachix-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

  test-unit-linux-x86_64:
    name: "Test (unit)"
    needs: [build-linux-x86_64-test-archive]
    runs-on: warp-ubuntu-latest-x64-8x
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-nix
      - uses: actions/download-artifact@v8.0.1
        with:
          name: se-test-archive
          path: ${{ runner.temp }}/test-archive
      - name: Run unit tests from archive
        run: |
          nix develop --command cargo nextest run \
            --archive-file "$RUNNER_TEMP/test-archive/archive.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --profile unit
      - name: Upload unit test results to Gaffer
        if: ${{ !cancelled() }}
        uses: gaffer-sh/gaffer-uploader@v2
        with:
          gaffer_upload_token: ${{ secrets.GAFFER_PROJECT_TOKEN }}
          report_path: target/nextest/unit/junit.xml
          commit_sha: ${{ github.sha }}
          branch: ${{ github.head_ref || github.ref_name }}
          test_suite: unit

  test-integration-catalog:
    name: "Test (${{ matrix.catalog }})"
    needs: [build-linux-x86_64-test-archive]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: warp-ubuntu-latest-x64-8x
    environment: integration
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        catalog:
          - cloudflare-r2-basin-catalog
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-nix
      - uses: actions/download-artifact@v8.0.1
        with:
          name: se-test-archive
          path: ${{ runner.temp }}/test-archive
      - uses: ./.github/actions/setup-integration-secrets
        with:
          profile: cloudflare-r2-x-${{ matrix.catalog }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure-key-vault-name: ${{ secrets.AZURE_KEY_VAULT_NAME }}
      - name: Run integration tests from archive
        run: |
          nix develop --command cargo nextest run \
            --archive-file "$RUNNER_TEMP/test-archive/archive.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --profile integration
      - name: Upload integration test results to Gaffer
        if: ${{ !cancelled() && hashFiles('target/nextest/integration/junit.xml') != '' }}
        uses: gaffer-sh/gaffer-uploader@v2
        with:
          gaffer_upload_token: ${{ secrets.GAFFER_PROJECT_TOKEN }}
          report_path: target/nextest/integration/junit.xml
          commit_sha: ${{ github.sha }}
          branch: ${{ github.head_ref || github.ref_name }}
          test_suite: integration-catalog-${{ matrix.catalog }}

  build-image-linux-x86_64:
    name: "Build image"
    uses: ./.github/workflows/build.yml
    needs: [build-linux-x86_64]
    with:
      os: warp-ubuntu-latest-x64-8x
      target: image
    secrets:
      cachix-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

  build-stress-image-linux-x86_64:
    name: "Build stress image"
    uses: ./.github/workflows/build.yml
    needs: [build-linux-x86_64]
    with:
      os: warp-ubuntu-latest-x64-8x
      target: stress-image
    secrets:
      cachix-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"
