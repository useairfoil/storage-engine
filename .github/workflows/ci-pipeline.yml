name: CI Pipeline

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  merge_group:

  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "main"
    types:
      - opened
      - synchronize

jobs:
  build-linux-x86_64:
    name: "Linux x86_64: Build"
    uses: ./.github/workflows/build.yml
    with:
      os: warp-ubuntu-latest-x64-8x
    secrets:
      cachix-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

  build-linux-x86_64-test-archive:
    name: "Linux x86_64: Build test archive"
    uses: ./.github/workflows/build.yml
    needs: [build-linux-x86_64]
    with:
      os: warp-ubuntu-latest-x64-8x
      target: test-archive
      artifact_name: "se-test-archive"
    secrets:
      cachix-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

  test-unit-linux-x86_64:
    name: "Linux x86_64: Unit tests"
    needs: [build-linux-x86_64-test-archive]
    runs-on: warp-ubuntu-latest-x64-8x
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-nix
      - uses: actions/download-artifact@v8.0.1
        with:
          name: se-test-archive
          path: ${{ runner.temp }}/test-archive
      - name: Run unit tests from archive
        run: |
          nix develop --command cargo nextest run \
            --archive-file "$RUNNER_TEMP/test-archive/archive.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --profile unit

  build-image-linux-x86_64:
    name: "Linux x86_64: Build image"
    uses: ./.github/workflows/build.yml
    needs: [build-linux-x86_64]
    with:
      os: warp-ubuntu-latest-x64-8x
      target: image
    secrets:
      cachix-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

  build-stress-image-linux-x86_64:
    name: "Linux x86_64: Build stress image"
    uses: ./.github/workflows/build.yml
    needs: [build-linux-x86_64]
    with:
      os: warp-ubuntu-latest-x64-8x
      target: stress-image
    secrets:
      cachix-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"
