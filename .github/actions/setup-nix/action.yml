name: Set up Nix
description: Install Nix and configure the Airfoil binary cache

inputs:
  cachix-token:
    description: Optional Cachix authentication token for cache writes
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set $USER if needed
      shell: bash
      run: |
        if [ -z "$USER" ]; then
          echo "USER=runner" >> "$GITHUB_ENV"
        fi
    - name: Set up nix cache
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: nix
    - name: Install nix
      uses: cachix/install-nix-action@v31.11.3
      with:
        nix_path: nixpkgs=channel:nixos-26.05
    - name: Connect cachix
      uses: cachix/cachix-action@v17
      with:
        name: airfoil-public
        authToken: ${{ inputs.cachix-token }}
