name: Set up integration test secrets
description: Requires Nix and id-token write permission; logs in to Azure and exports a SecretSpec profile

inputs:
  profile:
    description: Profile in crates/integration-tests/secretspec.toml
    required: true
  azure-client-id:
    description: Azure identity client ID
    required: true
  azure-tenant-id:
    description: Azure tenant ID
    required: true
  azure-subscription-id:
    description: Azure subscription ID
    required: true
  azure-key-vault-name:
    description: Azure Key Vault containing the integration test configurations
    required: true

runs:
  using: composite
  steps:
    - name: Install Azure CLI
      shell: bash
      run: |
        nix build --inputs-from . nixpkgs#azure-cli --out-link "$RUNNER_TEMP/azure-cli"
        echo "$RUNNER_TEMP/azure-cli/bin" >> "$GITHUB_PATH"
    - name: Log in to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}
    - name: Load integration test configuration
      uses: cachix/secretspec-action@9a02088c2a41efaf75c0e10e574f0275964bbe7f
      with:
        version: "0.21.1"
        working-directory: crates/integration-tests
        provider: akv://${{ inputs.azure-key-vault-name }}?auth=cli
        profile: ${{ inputs.profile }}
