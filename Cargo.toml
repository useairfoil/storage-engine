[workspace.package]
edition = "2024"
authors = ["Francesco Ceccon", "The Wings contributors"]
version = "0.2.0"
license = "Apache-2.0"
repository = "https://github.com/useairfoil/wings"

[workspace]
resolver = "2"
default-members = ["wings"]
members = [
    "wings_ingestion",
    "wings_ingestion_server",
    "wings",
    "wings_common",
    "wings_server",
    "wings_observability",
    "wings_stress",
    "wings_secret_store",
    "wings_meta_store"
]

[profile.maxperf]
inherits = "release"
codegen-units = 1
lto = "fat"
incremental = false

[workspace.dependencies]
arrow-array = "58.4.0"
arrow-flight = { version = "58.4.0", features = ["flight-sql"] }
arrow-ipc = "58.4.0"
arrow-schema = "58.4.0"
axum = "0.8.9"
async-trait = "0.1.89"
backon = { version = "1.6.0", default-features = false }
base64 = "0.22.1"
bytes = "1.11.1"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive", "env", "unicode"] }
dashmap = "6.2.1"
iceberg = "0.10.1"
iceberg-catalog-rest = "0.10.1"
insta = { version = "1.47.2", features = ["yaml"] }
nu-ansi-term = "0.50.3"
object_store = { version = "0.14.1", features = ["aws", "gcp", "azure"] }
paste = "1.0.15"
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
opentelemetry_sdk = "0.32.1"
rand = "0.10.1"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
slatedb-common = "0.16.0"
slatedb-txn-obj = "0.16.0"
thiserror = "2.0.18"
tonic = "0.14.6"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.19"
tokio-test = "0.4.5"
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ulid = "1.2.1"
uuid = { version = "1.23.3", features = ["v4"] }
# local crates
wings-ingestion = { path = "./wings_ingestion" }
wings-ingestion-server = { path = "./wings_ingestion_server" }
wings-common = { path = "./wings_common" }
wings-server = { path = "./wings_server" }
wings-observability = { path = "./wings_observability" }
wings-secret-store = { path = "./wings_secret_store" }
wings-meta-store = { path = "./wings_meta_store" }
