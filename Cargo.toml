[workspace.package]
edition = "2024"
authors = ["Francesco Ceccon", "The Storage Engine contributors"]
version = "0.2.0"
license = "Apache-2.0"
repository = "https://github.com/useairfoil/storage-engine"

[workspace]
resolver = "2"
exclude = ["vendor/iceberg"]
default-members = ["bins/storage-engine"]
members = [
    "bins/storage-engine",
    "bins/stress",
    # "crates/arrow-buffer",
    "crates/common",
    # "crates/commit",
    "crates/iceberg",
    "crates/ingestion",
    "crates/flight-server",
    # "crates/integration-tests",
    # "crates/materialization",
    # "crates/meta-store",
    "crates/metadata",
    "crates/metadata-client",
    "crates/metadata-server",
    "crates/observability",
    # "crates/reconciliation",
    # "crates/scheduler",
    "crates/secret-store",
    # "crates/server",
    "crates/wal",
    # "crates/worker"
]

[profile.maxperf]
inherits = "release"
codegen-units = 1
lto = "fat"
incremental = false

[workspace.dependencies]
arrow-array = "58.4.0"
arrow-flight = { version = "58.4.0", features = ["flight-sql"] }
arrow-ipc = "58.4.0"
arrow-schema = "58.4.0"
axum = "0.8.9"
async-trait = "0.1.89"
azure_core = "1.0.0"
azure_identity = { version = "1.0.0", features = ["tokio"] }
azure_security_keyvault_secrets = "1.0.1"
backon = { version = "1.6.0", default-features = false }
base64 = "0.22.1"
bytes = "1.11.1"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive", "env", "unicode"] }
crc32fast = "1.5.0"
dashmap = "6.2.1"
futures = "0.3.34"
iceberg = "0.10.1"
iceberg-catalog-rest = "0.10.1"
# iceberg-storage-opendal = { version = "0.10.1", default-features = false, features = ["opendal-s3"] }
insta = { version = "1.47.2", features = ["yaml"] }
nu-ansi-term = "0.50.3"
object_store = { version = "0.14.1", features = ["aws", "gcp", "azure"] }
# object_store_opendal = { version = "0.59.0", features = ["services-s3"] }
# opendal = { version = "0.58.2", features = ["services-s3", "services-azblob"] }
opendata-common = { git = "https://github.com/opendata-oss/opendata.git", rev = "5f5c288" }
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
opentelemetry_sdk = "0.32.1"
parquet = "58.4.0"
paste = "1.0.15"
rand = "0.10.1"
rand_xoshiro = "0.8.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
roaring = "0.11.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = { version = "3.24.0", features = ["base64"] }
slatedb = "0.16.0"
slatedb-common = "0.16.0"
slatedb-txn-obj = "0.16.0"
thiserror = "2.0.18"
thread_local = "1.1.9"
tonic = "0.14.6"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.19"
tokio-test = "0.4.5"
tokio-util = "0.7.18"
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
typetag = "0.2.23"
ulid = "1.2.1"
uuid = { version = "1.23.3", features = ["v4"] }
zstd = "0.13.3"
# local crates
# opendata-arrow-buffer = { path = "./crates/arrow-buffer" }
se-common = { path = "./crates/common" }
# se-commit = { path = "./crates/commit" }
se-iceberg = { path = "./crates/iceberg" }
se-ingestion = { path = "./crates/ingestion" }
se-flight-server = { path = "./crates/flight-server" }
# se-materialization = { path = "./crates/materialization" }
# se-meta-store = { path = "./crates/meta-store" }
se-metadata = { path = "./crates/metadata" }
se-metadata-client = { path = "./crates/metadata-client" }
se-metadata-server = { path = "./crates/metadata-server" }
se-observability = { path = "./crates/observability" }
# se-reconciliation = { path = "./crates/reconciliation" }
# se-scheduler = { path = "./crates/scheduler" }
se-secret-store = { path = "./crates/secret-store" }
# se-server = { path = "./crates/server" }
se-wal = { path = "./crates/wal" }
# se-worker = { path = "./crates/worker" }

[patch.crates-io]
iceberg = { path = "vendor/iceberg" }
