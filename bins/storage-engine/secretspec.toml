[project]
name = "storage-engine"
revision = "1.0"

[profiles.default]
SE_OBJECT_STORE_TYPE = {
    description = "type of object store used by the engine",
    required = true
}
SE_SECRET_STORE_TYPE = {
    description = "type of secret store used by the engine",
    required = true
}

[profiles.development]
SE_OBJECT_STORE_TYPE = { default = "s3" }
SE_SECRET_STORE_TYPE = { default = "file" }
SE_S3_BUCKET = {
    description = "name of the engine bucket",
    default = "af-ops"
}
SE_S3_REGION = {
    description = "object store region",
    default = "local"
}
SE_S3_ENDPOINT = {
    description = "object store endpoint",
    default = "http://127.0.0.1:8333"
}
AWS_ACCESS_KEY_ID = {
    description = "s3 access key id",
    default = "seaweedfs-root-user"
}
AWS_SECRET_ACCESS_KEY = {
    description = "s3 secret access key",
    default = "seaweedfs-root-password"
}
AWS_ALLOW_HTTP = {
    description = "allow http",
    default = "true"
}
