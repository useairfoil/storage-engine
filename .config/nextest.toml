[profile.default]
default-filter = 'not package(=se-integration-tests)'

[profile.ci]
fail-fast = false
default-filter = 'all()'

[profile.unit]
inherits = 'ci'
default-filter = 'not package(=se-integration-tests)'

[profile.unit.junit]
path = 'junit.xml'

[profile.integration]
default-filter = 'package(=se-integration-tests)'

[profile.integration.junit]
path = 'junit.xml'
